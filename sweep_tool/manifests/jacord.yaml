name: jacord
description: |
  Discord-lite chat backend: workspaces → channels → messages, with
  reply trees per message and User nodes for authorship.  The
  load_channel walker fetches every top-level message in a channel
  plus one hop of replies — the shape of a chat app's page-load query.

  For pooled Markov, jac_db.pgdump should point at a multi-channel Postgres dump
  seeded with bootstrap.py --users 200 --benchmark-channels 20
  --messages 1000 or larger.  The current default dump has 20 similarly
  sized load_channel entry points, each with at least 1000 top-level
  messages, and a shared author pool.

app_dir: ../../../jacord
runner: prefetch_python

scripts:
  sweep: sweep_prefetch_limit.sh

outputs:
  results_csv: sweep_prefetch_limit.csv
  logs_dir: logs
  profiles_dir: profiles

parameters:
  - name: SWEEP_POLICIES
    label: Prefetch policies
    kind: str
    default: "none dbridge_like ttg oracle"
    help: >
      Space-separated policies to run. Supported: none, dbridge_like, ttg,
      oracle, markov, markov1-pooled, coaccess, coaccess-pooled, selep,
      history, manual. Oracle, Markov, and co-access default to
      auto-record/train then replay.

  - name: SWEEP_ORACLE_MODE
    label: Oracle mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto records a no-prefetch access set before each measured oracle
      trial; file replays existing UUID files.

  - name: SWEEP_ORACLE_DIR
    label: Oracle dir
    kind: str
    default: "oracle_plans"
    help: Directory for generated/read oracle UUID files.

  - name: SWEEP_MARKOV_MODE
    label: Markov mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto trains a first-order Markov model from a no-prefetch access log
      before each measured trial; file replays existing model files.

  - name: SWEEP_MARKOV_DIR
    label: Markov dir
    kind: str
    default: "markov_models"
    help: Directory for generated/read Markov model JSON files.

  - name: SWEEP_MARKOV_TRAIN_NS
    label: Markov train Ns
    kind: int_list
    default: [10]
    help: >
      Training request counts swept by markov1-pooled. Each N produces
      result rows labeled markov1-pooled-N<N>.

  - name: SWEEP_MARKOV_POOL_SEED
    label: Markov pool seed
    kind: int
    default: 42
    help: Seed used to shuffle the adapter's seeded spawn pool before training selection.

  - name: SWEEP_COACCESS_MODE
    label: Co-access mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto trains a co-access clustering model from no-prefetch access logs;
      file replays existing model files.

  - name: SWEEP_COACCESS_DIR
    label: Co-access dir
    kind: str
    default: "coaccess_models"
    help: Directory for generated/read co-access model JSON files.

  - name: SWEEP_COACCESS_TRAIN_NS
    label: Co-access train Ns
    kind: int_list
    default: [10]
    help: >
      Training request counts swept by coaccess-pooled. Each N produces
      result rows labeled coaccess-pooled-N<N>.

  - name: SWEEP_COACCESS_POOL_SEED
    label: Co-access pool seed
    kind: int
    default: 42
    help: Seed used to shuffle the adapter's seeded spawn pool before training selection.

  - name: SWEEP_COACCESS_CLUSTER_THRESHOLD
    label: Co-access cluster threshold
    kind: str
    default: "0.05"
    help: Greedy transaction-clustering Jaccard threshold.

  - name: SWEEP_RANDOM_N
    label: Random paired N
    kind: int
    default: 20
    help: Number of measured stream requests used by random-paired sweeps.

  - name: SWEEP_RANDOM_TRAIN_K
    label: Random paired train K
    kind: int
    default: 20
    help: Number of sampled requests used to train stream predictors such as SeLeP.

  - name: SWEEP_RANDOM_SEED
    label: Random paired seed
    kind: int
    default: 42
    help: Seed used to shuffle the seeded spawn pool for random-paired sweeps.

  - name: SWEEP_RANDOM_POLICIES
    label: Random paired policies
    kind: str
    default: "none dbridge_like ttg selep"
    help: Stream-safe runtime policies compared when SWEEP_POLICIES=random-paired.

  - name: SELEP_MODEL_KIND
    label: SeLeP model
    kind: enum
    default: "faithful"
    choices: ["faithful", "lstm", "frequency", "original"]
    help: >
      SeLeP sidecar model. faithful uses SeLeP semantic block encoding,
      affinity/Clay-style partitioning, partition encodings, and the SeLeP
      ED-LSTM; lstm keeps the older binary-vector adapter; frequency is a
      plumbing-only fallback.

  - name: SELEP_TOP_K
    label: SeLeP partitions
    kind: int
    default: 42
    help: Number of partitions predicted per SQL event.


  - name: SELEP_LOOK_BACK
    label: SeLeP lookback
    kind: int
    default: 4
    help: Number of prior partition-access events used as LSTM input.

  - name: SELEP_PARTITION_SIZE
    label: SeLeP partition size
    kind: int
    default: 128
    help: Maximum PostgreSQL blocks per SeLeP partition.

  - name: SELEP_BLOCK_LIMIT
    label: SeLeP block cap
    kind: int
    default: 0
    help: Maximum PostgreSQL blocks prewarmed per prediction; 0 keeps all blocks in the predicted partitions.

  - name: SELEP_LSTM_BATCH_SIZE
    label: SeLeP batch size
    kind: int
    default: 32
    help: Batch size used when training the SeLeP LSTM.

  - name: SELEP_LSTM_VALIDATION_FRACTION
    label: SeLeP validation
    kind: str
    default: "0.10"
    help: Fraction of training examples held out for SeLeP LSTM validation and early stopping.

  - name: SELEP_TEST_FRACTION
    label: SeLeP test fraction
    kind: str
    default: "0.10"
    help: Fraction of supervised SeLeP examples reserved for held-out model reporting.

  - name: SELEP_ENCODING_LENGTH
    label: SeLeP encoding length
    kind: int
    default: 32
    help: Width of SeLeP block and partition semantic encodings.

  - name: SELEP_ENCODING_EPOCHS
    label: SeLeP encoding epochs
    kind: int
    default: 100
    help: Maximum epochs for SeLeP semantic block autoencoder training.

  - name: SELEP_TABLE_ENCODING_METHOD
    label: SeLeP table encoder
    kind: str
    default: "AutoEncoder_1"
    help: SeLeP table/block encoder method; AutoEncoder_1 matches the MLP encoder path.

  - name: SELEP_SEMANTIC_ROWS_PER_BLOCK
    label: SeLeP rows/block
    kind: int
    default: 64
    help: Maximum table rows sampled from each observed PostgreSQL block for semantic encoding.

  - name: SELEP_BLOCK_SOURCE
    label: SeLeP blocks
    kind: enum
    default: "jac-ctid"
    choices: ["jac-ctid", "pg-buffercache", "hash"]
    help: >
      jac-ctid derives Jac anchor heap blocks without restarting PostgreSQL;
      pg-buffercache keeps the original-style replay labeler for validation;
      hash is only for plumbing smoke tests.

  - name: SELEP_RELATION_ALLOWLIST
    label: SeLeP relations
    kind: str
    default: "anchors,graph_types"
    help: >
      Comma-separated PostgreSQL relations retained from the replayed request
      block trace. The default keeps Jac data/topology tables and excludes
      auth/catalog noise.

  - name: SELEP_RELATION_KINDS
    label: SeLeP relation kinds
    kind: str
    default: "r"
    help: >
      Comma-separated pg_class relkind values retained from pg_buffercache.
      The default keeps heap tables and excludes indexes.

  - name: SELEP_MAX_BLOCK_SELECTS
    label: SeLeP max SELECTs
    kind: int
    default: 0
    help: Maximum successful SELECT events replayed while building block partitions; 0 uses all observed SELECT events.

  - name: SELEP_CLAY_REPARTITION_THRESHOLD
    label: SeLeP Clay repartition threshold
    kind: int
    default: 2500
    help: Training-query window before Clay-style affinity repartitioning.

  - name: SELEP_CLAY_INITIAL_FILL
    label: SeLeP Clay initial fill
    kind: str
    default: "0.90"
    help: Initial physical-block partition fill fraction before reserving empty partitions.

  - name: SELEP_CLAY_EMPTY_FRACTION
    label: SeLeP Clay empty fraction
    kind: str
    default: "0.10"
    help: Fraction of extra empty partitions reserved for Clay clump relocation.

  - name: SELEP_CLAY_MAX_LOAD
    label: SeLeP Clay max load
    kind: str
    default: "1.0"
    help: Overload threshold for Clay-style repartitioning.

  - name: SELEP_CLAY_WEIGHT_RESET
    label: SeLeP Clay weight reset
    kind: str
    default: "0.10"
    help: Affinity weight decay applied after each repartitioning window.

  - name: SELEP_LSTM_EPOCHS
    label: SeLeP epochs
    kind: int
    default: 75
    help: Maximum LSTM training epochs for the SeLeP sidecar model; early stopping may end sooner.

  - name: TEST_USER
    label: Benchmark user
    kind: str
    default: "user_0000"
    help: Matches bootstrap.py's primary benchmark user.

  - name: TEST_PASSWORD
    label: Benchmark password
    kind: str
    default: "password"
    help: Matches bootstrap.py's seeded password.

  - name: JACORD_DUMP
    label: Jacord dump
    kind: str
    default: "jac_db.pgdump"
    help: >
      Postgres dump restored for each Jacord case. The Jacord adapter fails if
      this configured dump is missing.

  - name: JACORD_CHANNEL_ID
    label: Jacord channel
    kind: str
    default: ""
    help: >
      Optional fixed channel UUID for load_channel. Leave blank to let the
      adapter select a benchmark channel from the restored dump.

  - name: JACORD_CHANNEL_PICK
    label: Channel picker
    kind: enum
    default: "first"
    choices: ["first", "largest"]
    help: >
      How to select a channel when JACORD_CHANNEL_ID is blank. first uses the
      first channel returned by ListChannelIds without probing candidates;
      largest probes candidate channels once and reuses the largest target for
      the whole sweep.

  - name: SWEEP_MARKOV_POOL_SIZE
    label: Channel pool size
    kind: int
    default: 40
    help: Number of Jacord channels exposed for pooled/random-paired runs.

  - name: JACORD_CHANNEL_SCAN_LIMIT
    label: Channel scan
    kind: int
    default: 1000
    help: Maximum number of ListChannelIds results to consider for automatic channel selection.

  - name: JACORD_MIN_CHANNEL_MESSAGES
    label: Min messages
    kind: int
    default: 1000
    help: >
      Fail the Jacord sweep if the selected load_channel target reports fewer
      messages. Set to 0 to disable this guard.

  - name: SWEEP_PREFETCH_LIMITS
    label: Prefetch limits
    kind: int_list
    default: [500, 1000, 2000, 4000, 6000, 8000, 12000]
    help: >
      Space-separated integer list.  Jacord load_channel requests can touch
      several thousand anchors once replies/authors are included; this default
      captures the low-cap region and includes saturated points for oracle and
      TTG.

  - name: JAC_TRIALS
    label: Trials
    kind: int
    default: 10
    help: Number of repeated measured load_channel requests per case.

  - name: JAC_QUERY_CACHE
    label: Query result cache
    kind: enum
    default: "1"
    choices: ["1", "0"]
    help: >
      Runtime graph-query result memoization. Keep enabled for stock Jac
      performance; set to 0 only for cache-ablation runs.
