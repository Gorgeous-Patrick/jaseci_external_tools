name: jacord
description: |
  Discord-lite chat backend: workspaces → channels → messages, with
  reply trees per message and User nodes for authorship.  The
  load_channel walker fetches every top-level message in a channel
  plus one hop of replies — the shape of a chat app's page-load query.

  For pooled Markov, jac_db.pgdump should point at a multi-channel Postgres dump
  seeded with bootstrap.py --users 200 --benchmark-channels 20
  --messages 1000 or larger.  The current default dump has 20 similarly
  sized load_channel entry points, each with at least 1000 top-level
  messages, and a shared author pool.

app_dir: ../../../jacord
runner: prefetch_python

scripts:
  sweep: sweep_prefetch_limit.sh

outputs:
  results_csv: sweep_prefetch_limit.csv
  logs_dir: logs
  profiles_dir: profiles

parameters:
  - name: SWEEP_POLICIES
    label: Prefetch policies
    kind: str
    default: "none ttg oracle markov1-pooled coaccess-pooled selep"
    help: >
      Space-separated policies to run. Supported: none, ttg, oracle,
      markov, markov1-pooled, coaccess, coaccess-pooled, selep, history,
      manual. Oracle, Markov, and co-access default to auto-record/train
      then replay.

  - name: SWEEP_ORACLE_MODE
    label: Oracle mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto records a no-prefetch access set before each measured oracle
      trial; file replays existing UUID files.

  - name: SWEEP_ORACLE_DIR
    label: Oracle dir
    kind: str
    default: "oracle_plans"
    help: Directory for generated/read oracle UUID files.

  - name: SWEEP_MARKOV_MODE
    label: Markov mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto trains a first-order Markov model from a no-prefetch access log
      before each measured trial; file replays existing model files.

  - name: SWEEP_MARKOV_DIR
    label: Markov dir
    kind: str
    default: "markov_models"
    help: Directory for generated/read Markov model JSON files.

  - name: SWEEP_MARKOV_TRAIN_NS
    label: Markov train Ns
    kind: int_list
    default: [10]
    help: >
      Training request counts swept by markov1-pooled. Each N produces
      result rows labeled markov1-pooled-N<N>.

  - name: SWEEP_MARKOV_POOL_SEED
    label: Markov pool seed
    kind: int
    default: 42
    help: Seed used to shuffle the adapter's seeded spawn pool before training selection.

  - name: SWEEP_COACCESS_MODE
    label: Co-access mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto trains a co-access clustering model from no-prefetch access logs;
      file replays existing model files.

  - name: SWEEP_COACCESS_DIR
    label: Co-access dir
    kind: str
    default: "coaccess_models"
    help: Directory for generated/read co-access model JSON files.

  - name: SWEEP_COACCESS_TRAIN_NS
    label: Co-access train Ns
    kind: int_list
    default: [10]
    help: >
      Training request counts swept by coaccess-pooled. Each N produces
      result rows labeled coaccess-pooled-N<N>.

  - name: SWEEP_COACCESS_POOL_SEED
    label: Co-access pool seed
    kind: int
    default: 42
    help: Seed used to shuffle the adapter's seeded spawn pool before training selection.

  - name: SWEEP_COACCESS_CLUSTER_THRESHOLD
    label: Co-access cluster threshold
    kind: str
    default: "0.05"
    help: Greedy transaction-clustering Jaccard threshold.

  - name: SELEP_MODEL_KIND
    label: SeLeP model
    kind: enum
    default: "lstm"
    choices: ["lstm", "frequency"]
    help: >
      SeLeP sidecar model. lstm trains the original SeLeP binary LSTM in
      the Python 3.11 sidecar environment; frequency is a plumbing-only
      fallback for fast debugging.

  - name: SELEP_TOP_K
    label: SeLeP partitions
    kind: int
    default: 42
    help: Number of partitions predicted per SQL event.

  - name: SELEP_BLOCK_SOURCE
    label: SeLeP blocks
    kind: enum
    default: "pg-buffercache"
    choices: ["pg-buffercache", "hash"]
    help: >
      pg-buffercache replays training queries to discover PostgreSQL blocks;
      hash is only for plumbing smoke tests.

  - name: SELEP_MAX_BLOCK_SELECTS
    label: SeLeP max SELECTs
    kind: int
    default: 256
    help: Maximum successful SELECT events replayed while building block partitions.

  - name: SELEP_LSTM_EPOCHS
    label: SeLeP epochs
    kind: int
    default: 5
    help: LSTM training epochs for the SeLeP sidecar model.

  - name: TEST_USER
    label: Benchmark user
    kind: str
    default: "user_0000"
    help: Matches bootstrap.py's primary benchmark user.

  - name: TEST_PASSWORD
    label: Benchmark password
    kind: str
    default: "password"
    help: Matches bootstrap.py's seeded password.

  - name: JACORD_DUMP
    label: Jacord dump
    kind: str
    default: "jac_db.pgdump"
    help: >
      Postgres dump restored for each Jacord case. The Jacord adapter fails if
      this configured dump is missing.

  - name: JACORD_CHANNEL_ID
    label: Jacord channel
    kind: str
    default: ""
    help: >
      Optional fixed channel UUID for load_channel. Leave blank to let the
      adapter select a benchmark channel from the restored dump.

  - name: JACORD_CHANNEL_PICK
    label: Channel picker
    kind: enum
    default: "first"
    choices: ["first", "largest"]
    help: >
      How to select a channel when JACORD_CHANNEL_ID is blank. first uses the
      first channel returned by ListChannelIds without probing candidates;
      largest probes candidate channels once and reuses the largest target for
      the whole sweep.

  - name: JACORD_CHANNEL_SCAN_LIMIT
    label: Channel scan
    kind: int
    default: 1000
    help: Maximum number of ListChannelIds results to consider for automatic channel selection.

  - name: JACORD_MIN_CHANNEL_MESSAGES
    label: Min messages
    kind: int
    default: 1000
    help: >
      Fail the Jacord sweep if the selected load_channel target reports fewer
      messages. Set to 0 to disable this guard.

  - name: SWEEP_PREFETCH_LIMITS
    label: Prefetch limits
    kind: int_list
    default: [500, 1000, 2000, 4000, 6000, 8000, 12000]
    help: >
      Space-separated integer list.  Jacord load_channel requests can touch
      several thousand anchors once replies/authors are included; this default
      captures the low-cap region and includes saturated points for oracle and
      TTG.

  - name: JAC_TRIALS
    label: Trials
    kind: int
    default: 10
    help: Number of repeated measured load_channel requests per case.

  - name: JAC_QUERY_CACHE
    label: Query result cache
    kind: enum
    default: "1"
    choices: ["1", "0"]
    help: >
      Runtime graph-query result memoization. Keep enabled for stock Jac
      performance; set to 0 only for cache-ablation runs.
