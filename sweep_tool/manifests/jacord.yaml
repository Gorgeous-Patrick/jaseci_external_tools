name: jacord
description: |
  Discord-lite chat backend: workspaces → channels → messages, with
  reply trees per message and User nodes for authorship.  The
  load_channel walker fetches every top-level message in a channel
  plus one hop of replies — the shape of a chat app's page-load query.

  The benchmark dump (dumps/big.dump) is a single large channel:
  ~7425 messages (2500 top-level + ~4925 flat replies), one user, all
  authored locally.  Node working set per request is ~7426, so the
  prefetch sweep saturates around limit 8000.

app_dir: ../../../jacord
runner: prefetch_python

scripts:
  sweep: sweep_prefetch_limit.sh

outputs:
  results_csv: sweep_prefetch_limit.csv
  logs_dir: logs
  profiles_dir: profiles

parameters:
  - name: SWEEP_POLICIES
    label: Prefetch policies
    kind: str
    default: "oracle none ttg"
    help: >
      Space-separated policies to run. Supported: none, ttg, oracle,
      markov, history, manual. Oracle and Markov default to auto-record
      then replay.

  - name: SWEEP_ORACLE_MODE
    label: Oracle mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto records a no-prefetch access set before each measured oracle
      trial; file replays existing UUID files.

  - name: SWEEP_ORACLE_DIR
    label: Oracle dir
    kind: str
    default: "oracle_plans"
    help: Directory for generated/read oracle UUID files.

  - name: SWEEP_MARKOV_MODE
    label: Markov mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto trains a first-order Markov model from a no-prefetch access log
      before each measured trial; file replays existing model files.

  - name: SWEEP_MARKOV_DIR
    label: Markov dir
    kind: str
    default: "markov_models"
    help: Directory for generated/read Markov model JSON files.

  - name: TEST_USER
    label: Benchmark user
    kind: str
    default: "user_0000"
    help: Matches bootstrap.py's primary benchmark user.

  - name: TEST_PASSWORD
    label: Benchmark password
    kind: str
    default: "password"
    help: Matches bootstrap.py's seeded password.

  - name: JACORD_DUMP
    label: Jacord dump
    kind: str
    default: "dumps/big.dump"
    help: >
      Mongo dump restored for each Jacord case. The default includes both
      auth users and graph anchors; jac_db.dump may point at graph-only
      dumps that cannot satisfy user_0000/password login.

  - name: SWEEP_PREFETCH_LIMITS
    label: Prefetch limits
    kind: int_list
    default: [0, 500, 1000, 2000, 4000, 6000, 8000, 12000, 20000, 30000]
    help: >
      Space-separated integer list.  Node working set for the big.dump
      channel is ~7426 anchors, so e2e/walker/L3 improve up to ~8000 and
      then saturate flat (there is a hard ~2500 L3 floor of edge anchors
      the node-only prefetch never covers).  Limits above ~8000 only add
      dispatch overhead.

  - name: JAC_TRIALS
    label: Trials
    kind: int
    default: 30
    help: Number of repeated load_channel requests per case.
