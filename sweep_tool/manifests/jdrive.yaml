name: jdrive
description: |
  Drive-like folder tree benchmark.  The sweep runs VisibleFolderTree against
  a seeded JDrive tree with a visible branch and an equally-shaped hidden
  branch.  A Python seeder talks to a running Jac server and uses normal
  walker requests to create the folders and call TrashFolder on the hidden
  branch, so the TTG plan sees the same static Contains->Folder shape while
  the actual walker prunes part of the tree at runtime.

app_dir: ../../../jdrive
runner: prefetch_python

scripts:
  sweep: sweep_prefetch_limit.sh

outputs:
  results_csv: sweep_prefetch_limit.csv
  logs_dir: logs
  profiles_dir: profiles

parameters:
  - name: SWEEP_POLICIES
    label: Prefetch policies
    kind: str
    default: "none ttg oracle markov1-pooled coaccess-pooled"
    help: >
      Space-separated policies to run. Supported: none, ttg, oracle,
      markov, markov1-pooled, coaccess, coaccess-pooled, selep, history,
      manual. Oracle, Markov, and co-access default to auto-record/train
      then replay.

  - name: SWEEP_ORACLE_MODE
    label: Oracle mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto records a no-prefetch access set before each measured oracle
      trial; file replays existing UUID files.

  - name: SWEEP_ORACLE_DIR
    label: Oracle dir
    kind: str
    default: "oracle_plans"
    help: Directory for generated/read oracle UUID files.

  - name: SWEEP_MARKOV_MODE
    label: Markov mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto trains a first-order Markov model from a no-prefetch access log
      before each measured trial; file replays existing model files.

  - name: SWEEP_MARKOV_DIR
    label: Markov dir
    kind: str
    default: "markov_models"
    help: Directory for generated/read Markov model JSON files.

  - name: SWEEP_MARKOV_TRAIN_NS
    label: Markov train Ns
    kind: int_list
    default: [10]
    help: >
      Training request counts swept by markov1-pooled. Each N produces
      result rows labeled markov1-pooled-N<N>.

  - name: SWEEP_MARKOV_POOL_SEED
    label: Markov pool seed
    kind: int
    default: 42
    help: Seed used to shuffle the adapter's seeded spawn pool before training selection.

  - name: SWEEP_COACCESS_MODE
    label: Co-access mode
    kind: enum
    default: "auto"
    choices: ["auto", "file"]
    help: >
      auto trains a co-access clustering model from no-prefetch access logs;
      file replays existing model files.

  - name: SWEEP_COACCESS_DIR
    label: Co-access dir
    kind: str
    default: "coaccess_models"
    help: Directory for generated/read co-access model JSON files.

  - name: SWEEP_COACCESS_TRAIN_NS
    label: Co-access train Ns
    kind: int_list
    default: [10]
    help: >
      Training request counts swept by coaccess-pooled. Each N produces
      result rows labeled coaccess-pooled-N<N>.

  - name: SWEEP_COACCESS_POOL_SEED
    label: Co-access pool seed
    kind: int
    default: 42
    help: Seed used to shuffle the adapter's seeded spawn pool before training selection.

  - name: SWEEP_COACCESS_CLUSTER_THRESHOLD
    label: Co-access cluster threshold
    kind: str
    default: "0.05"
    help: Greedy transaction-clustering Jaccard threshold.

  - name: SELEP_MODEL_KIND
    label: SeLeP model
    kind: enum
    default: "lstm"
    choices: ["lstm", "frequency"]
    help: >
      SeLeP sidecar model. lstm trains the original SeLeP binary LSTM in
      the Python 3.11 sidecar environment; frequency is a plumbing-only
      fallback for fast debugging.

  - name: SELEP_TOP_K
    label: SeLeP partitions
    kind: int
    default: 42
    help: Number of partitions predicted per SQL event.

  - name: SELEP_BLOCK_SOURCE
    label: SeLeP blocks
    kind: enum
    default: "pg-buffercache"
    choices: ["pg-buffercache", "hash"]
    help: >
      pg-buffercache replays training queries to discover PostgreSQL blocks;
      hash is only for plumbing smoke tests.

  - name: SELEP_MAX_BLOCK_SELECTS
    label: SeLeP max SELECTs
    kind: int
    default: 256
    help: Maximum successful SELECT events replayed while building block partitions.

  - name: SELEP_LSTM_EPOCHS
    label: SeLeP epochs
    kind: int
    default: 5
    help: LSTM training epochs for the SeLeP sidecar model.

  - name: TEST_USER
    label: Benchmark user
    kind: str
    default: "sweep_user"
    help: Matches seed_sweep_db.py's default username.

  - name: TEST_PASSWORD
    label: Benchmark password
    kind: str
    default: "password"
    help: Matches seed_sweep_db.py's default password.

  - name: SWEEP_PREFETCH_LIMITS
    label: Prefetch limits
    kind: int_list
    default: [0, 100, 250, 500, 750, 1000, 1500]
    help: >
      Space-separated integer list.  0 disables TTG prefetching; positive
      values cap the per-request TTG prefetch plan.

  - name: JAC_TRIALS
    label: Trials
    kind: int
    default: 10
    help: Number of repeated VisibleFolderTree requests per prefetch limit.

  - name: JAC_QUERY_CACHE
    label: Query result cache
    kind: enum
    default: "1"
    choices: ["1", "0"]
    help: >
      Runtime graph-query result memoization. Keep enabled for stock Jac
      performance; set to 0 only for cache-ablation runs.

  - name: SWEEP_RESEED
    label: Reseed
    kind: enum
    default: "0"
    choices: ["0", "1"]
    help: >
      Set to 1 to rebuild jac_db.pgdump and sweep_seed.json before sweeping.
      The Python full-sweep adapter also rebuilds automatically when the
      existing seed lacks enough held-out training roots for pooled policies.

  - name: SWEEP_SEED_VISIBLE_DEPTH
    label: Visible depth
    kind: int
    default: 5
    help: Folder depth of the visible benchmark branch, including its branch root.

  - name: SWEEP_SEED_HIDDEN_DEPTH
    label: Hidden depth
    kind: int
    default: 5
    help: Folder depth of the hidden trashed branch, including its branch root.

  - name: SWEEP_SEED_TRAIN_ROOTS
    label: Train roots
    kind: int
    default: 10
    help: Number of independent training roots seeded for pooled Markov/co-access.
