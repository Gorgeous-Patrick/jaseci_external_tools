[db]
backend = "postgres"
mode = "remote_ssh"
host = "clarity2"
remote_app_root = "/home/baichuan/jaseci_remote_apps"
ssh_options = ["-F", "/home/patrickli/.ssh/config"]

# Two-machine setup:
# mode = "remote_ssh"
# host = "MACHINE2_HOST_OR_IP"
# ssh_user = "patrickli"
# remote_app_root = "/abs/path/to/benchmark/apps/on/machine2"
# ssh_options = ["-F", "/home/patrickli/.ssh/config"]
#
# If postgres_uri is omitted in remote_ssh mode, the sweep keeps each app's
# local Postgres port and replaces localhost with db.host.
# postgres_uri = "postgresql://jac:jac@MACHINE2_HOST_OR_IP:5432/jac_db"

[db.apps.jacord]
postgres_uri = "postgresql://jac:jac@clarity2.eecs.umich.edu:5432/jac_db"

[db.apps.littlex5]
postgres_uri = "postgresql://jac:jac@clarity2.eecs.umich.edu:5432/jac_db"

[db.apps.linked_list]
postgres_uri = "postgresql://jac:jac@clarity2.eecs.umich.edu:5432/jac_db"

[db.apps.jdrive]
postgres_uri = "postgresql://jac:jac@clarity2.eecs.umich.edu:5433/jac_db"
postgres_container = "jdrive-postgres"

[db.apps.jsearch]
postgres_uri = "postgresql://jac:jac@clarity2.eecs.umich.edu:5434/jac_db"
postgres_container = "jsearch-postgres"
