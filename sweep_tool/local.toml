[db]
mode = "local_docker"

# Two-machine setup:
# mode = "remote_ssh"
# host = "MACHINE2_HOST_OR_IP"
# ssh_user = "patrickli"
# remote_app_root = "/abs/path/to/benchmark/apps/on/machine2"
#
# If mongo_uri/redis_url are omitted in remote_ssh mode, the sweep keeps each
# app's local port and replaces localhost with db.host. For example, jsearch
# keeps 27019/6381 while jacord, linked_list, and littlex5 keep 27017/6379.
# mongo_uri = "mongodb://MACHINE2_HOST_OR_IP:27017"
# redis_url = "redis://MACHINE2_HOST_OR_IP:6379"
#
# Optional per-app overrides:
# [db.apps.jsearch]
# mongo_uri = "mongodb://MACHINE2_HOST_OR_IP:27019"
# redis_url = "redis://MACHINE2_HOST_OR_IP:6381"
